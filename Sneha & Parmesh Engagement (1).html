<title>Sneha & Parmesh Engagement.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Lora:wght@700&family=Quicksand:wght@500;600&display=swap">
<style>
/* Layout: a faithful animated version of the printed card. Magenta field, gold double frame that opens at the bottom, white tracked capitals, peach script for the names and "Engagement", rings and cream florals below. */
:root {
  --magenta: #98276b;
  --magenta-deep: #7d1d57;
  --night: #2b0c21;
  --white: #ffffff;
  --gold: #c9a03a;
  --peach: #ffcf94;
  --cream: #fff4e4;
  --script-names: "Dancing Script", "Brush Script MT", cursive;
  --script-big: "Great Vibes", "Snell Roundhand", cursive;
  --serif: "Lora", Georgia, serif;
  --sans: "Quicksand", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --gold-grad: linear-gradient(90deg, #a97a1f 0%, #ecd488 50%, #a97a1f 100%);
  --peach-grad: linear-gradient(100deg, #ffd9a0 0%, #ffe9c4 30%, #ffc283 55%, #ffe2b0 80%, #ffc98e 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding-block: 1.25rem 2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 80% 60% at 50% 30%, #4a1636 0%, transparent 70%), var(--night);
  color: var(--white);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: 0; animation: fade-in 2.4s ease .3s forwards; }

.stage { width: 100%; max-width: 34rem; container-type: inline-size; }
.card {
  position: relative;
  width: 100%;
  min-height: 141cqw;
  background: var(--magenta);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  overflow: hidden;
  isolation: isolate;
  box-shadow: 0 40px 70px -35px rgba(0, 0, 0, .7);
}
.glow {
  position: absolute; inset: -10% -20%; z-index: -1;
  background: radial-gradient(circle at 50% 36%, rgba(255, 150, 205, .30) 0%, rgba(255, 150, 205, 0) 58%);
  animation: breathe 7s ease-in-out infinite alternate;
}
.layer {
  transform: translate3d(calc(var(--mx, 0) * var(--dx, 0) * 1px), calc(var(--my, 0) * var(--dy, 0) * 1px + var(--sy, 0) * var(--sd, 0) * 1px), 0);
  will-change: transform;
}

/* Upper block carries the gold frame, which is open at the bottom like the printed card */
.upper {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8cqw 9cqw 3.5cqw;
}
.upper::before, .upper::after { content: ""; position: absolute; pointer-events: none; }
.upper::before { inset: 2.7cqw 4.7cqw 0 4.7cqw; border: 1px solid var(--gold); border-bottom: 0; }
.upper::after { inset: 3.7cqw 5.9cqw 0 5.9cqw; border: .6cqw solid; border-image: linear-gradient(180deg, #e9cf7a, #b0852b 50%, #e9cf7a) 1; border-bottom-width: 0; }

.orn { width: 66cqw; margin-top: 1cqw; }
.orn svg, .orn-b svg { display: block; width: 100%; height: auto; overflow: visible; }
.orn path, .orn-b path { fill: none; stroke: url(#gOrn); stroke-width: 2.2; stroke-linecap: round; }
.orn .solid, .orn-b .solid { fill: url(#gOrn); stroke: none; }
.orn-b { width: 62cqw; margin-top: 2cqw; }
.orn-b svg { transform: scaleY(-1); }

.eyebrow {
  margin: 0;
  font-family: var(--sans);
  font-weight: 500;
  font-size: clamp(.66rem, 2.55cqw, .95rem);
  letter-spacing: .3em;
  padding-left: .3em;
  text-transform: uppercase;
  line-height: 2.1;
  color: var(--white);
}
.eyebrow.first { margin-top: 6.5cqw; }

.gold-text {
  color: var(--peach);
  background: var(--peach-grad);
  background-size: 200% 100%;
  background-repeat: repeat-x;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.names {
  margin: 1.4cqw 0 4cqw;
  font-family: var(--script-names);
  font-weight: 600;
  font-size: clamp(2.3rem, 11.6cqw, 4.3rem);
  line-height: 1.25;
  padding: 0 .12em;
  animation: shimmer 8s linear 8s infinite;
}
.eng-wrap { position: relative; width: 100%; margin: 0; }
.eng {
  margin: 0;
  font-family: var(--script-big);
  font-weight: 400;
  font-size: clamp(3.4rem, 19.5cqw, 7rem);
  line-height: 1.35;
  padding: 0 .1em;
  animation: shimmer 8s linear 9s infinite;
}
.butterfly { position: absolute; right: 6%; top: -3.2cqw; width: 8.5cqw; min-width: 2.2rem; }
.butterfly svg { width: 100%; height: auto; display: block; animation: drift 9s ease-in-out infinite alternate; }
.wing-l, .wing-r { animation: flap .45s ease-in-out infinite alternate; transform-origin: 24px 22px; }

.date { width: 100%; margin-top: -1.2cqw; }
.month {
  margin: 0;
  font-family: var(--sans);
  font-weight: 600;
  font-size: clamp(.9rem, 3.5cqw, 1.3rem);
  letter-spacing: .26em;
  padding-left: .26em;
  text-transform: uppercase;
}
.dayrow {
  display: grid;
  grid-template-columns: 22cqw auto 22cqw;
  justify-content: center;
  align-items: center;
  gap: 3.2cqw;
  margin: 1.4cqw 0 1.2cqw;
}
.side {
  position: relative;
  padding: 2.6cqw 0;
  font-family: var(--sans);
  font-weight: 500;
  font-size: clamp(.72rem, 3.3cqw, 1.2rem);
  letter-spacing: .2em;
  padding-left: .2em;
  text-transform: uppercase;
  white-space: nowrap;
}
.side::before, .side::after { content: ""; position: absolute; left: 0; right: 0; height: .5cqw; min-height: 2px; background: var(--gold); transform-origin: center; }
.side::before { top: 0; }
.side::after { bottom: 0; }
.day {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(2.8rem, 9.8cqw, 5.2rem);
  line-height: 1;
  color: var(--white);
}
.year {
  margin: 0;
  font-family: var(--sans);
  font-weight: 600;
  font-size: clamp(.9rem, 3.4cqw, 1.3rem);
  letter-spacing: .3em;
  padding-left: .3em;
}

.lower { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 5cqw 11cqw; flex: 1; }
.venue { margin: 1.2cqw 0 0; font-style: normal; max-width: 86cqw; }
.venue a {
  display: block;
  color: var(--white);
  text-decoration: none;
  font-family: var(--sans);
  font-weight: 500;
  font-size: clamp(.68rem, 2.75cqw, 1rem);
  letter-spacing: .2em;
  line-height: 1.85;
  text-transform: uppercase;
  text-wrap: balance;
}
.venue a:hover { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: .35em; }
.venue a:focus-visible, .replay:focus-visible { outline: 2px solid var(--peach); outline-offset: 4px; }

.rings { width: 33cqw; margin-top: 3cqw; }
.rings svg { display: block; width: 100%; height: auto; overflow: visible; animation: float 6s ease-in-out infinite alternate; }
.rings .band { fill: none; stroke: url(#gRing); stroke-linecap: round; }
.rings .shine { fill: none; stroke: #fff6c8; stroke-width: 1.4; stroke-linecap: round; opacity: .7; }

.florals-wrap { position: absolute; left: 0; right: 0; bottom: 0; height: 0; z-index: 1; pointer-events: none; }
.florals { position: absolute; bottom: -2cqw; width: 23cqw; }
.florals.l { left: -2cqw; }
.florals.r { right: -2cqw; transform: scaleX(-1); }
.florals svg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite alternate; }
.florals.r svg { animation-delay: -3s; }
.floral-row { position: absolute; left: 21cqw; right: 21cqw; bottom: -3.5cqw; height: auto; }
.floral-row svg { display: block; width: 100%; height: auto; overflow: visible; }

.replay {
  margin-top: 1.4rem;
  padding: .6rem 1.3rem .55rem;
  background: transparent;
  color: var(--cream);
  border: 1px solid var(--gold);
  font-family: var(--sans);
  font-weight: 500;
  font-size: .7rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .3s, color .3s;
}
.replay:hover { background: var(--gold); color: var(--night); }

/* Intro sequence, restarted by toggling .play on the card */
.play .rv { animation: rise 1.3s var(--ease) var(--d, 0s) both; }
.play .wipe { animation: wipe 2.2s var(--ease) var(--d, 0s) both, shimmer 8s linear calc(var(--d, 0s) + 4s) infinite; }
.play .draw { stroke-dasharray: 1; animation: draw 2.2s var(--ease) var(--d, 0s) both; }
.play .side::before, .play .side::after { animation: grow 1.3s var(--ease) var(--d, 0s) both; }
.play .upper::before, .play .upper::after { animation: frame-in 1.8s var(--ease) .2s both; }
.play .glow { animation: glow-in 2s ease both, breathe 7s ease-in-out 2s infinite alternate; }
.play .florals, .play .floral-row { animation: bloom-in 2.2s var(--ease) var(--d, 0s) both; }

@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes wipe { from { clip-path: inset(-30% 104% -30% -4%); opacity: 0; } 25% { opacity: 1; } to { clip-path: inset(-30% -4% -30% -4%); opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes frame-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { from { background-position: 0 0; } to { background-position: 200% 0; } }
@keyframes glow-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { from { opacity: .75; transform: scale(1); } to { opacity: 1; transform: scale(1.06); } }
@keyframes fade-in { to { opacity: 1; } }
@keyframes float { from { transform: translateY(-3px) rotate(-1deg); } to { transform: translateY(4px) rotate(1deg); } }
@keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.4deg); } }
@keyframes bloom-in { from { opacity: 0; transform: translateY(40px) scale(.85); } to { opacity: 1; transform: none; } }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.35); } }
@keyframes drift { from { transform: translate(0, 0) rotate(-4deg); } to { transform: translate(-10px, 6px) rotate(5deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .layer { transform: none; }
  #fx { opacity: 1; }
}
</style>

<button class="replay" id="replay" type="button">Replay</button>

<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var card = document.getElementById('card');
  var topOrn = document.getElementById('ornTop');
  var bottomOrn = document.getElementById('ornBottom');
  bottomOrn.innerHTML = topOrn.innerHTML;

  function play() {
    card.classList.remove('play');
    void card.offsetWidth;
    card.classList.add('play');
  }
  play();
  document.getElementById('replay').addEventListener('click', function () {
    play();
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });

  /* Gold sparkles and cream petals */
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, items = [];
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make(kind) {
    return {
      k: kind, x: Math.random() * W, y: Math.random() * H,
      r: kind === 's' ? 2 + Math.random() * 4 : 4 + Math.random() * 4,
      vx: (Math.random() - .5) * .15,
      vy: kind === 's' ? -(.08 + Math.random() * .22) : .16 + Math.random() * .3,
      ph: Math.random() * 6.28, sp: .6 + Math.random() * 1.4,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .02,
      c: Math.random() < .5 ? 'rgba(255,236,220,' : 'rgba(255,214,170,'
    };
  }
  function seed() {
    var n = Math.round(Math.min(46, Math.max(22, W / 28)));
    items = [];
    for (var i = 0; i < n; i++) items.push(make('s'));
    for (var j = 0; j < 12; j++) items.push(make('p'));
  }
  function star(x, y, r, a) {
    ctx.globalAlpha = a * .3;
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 6.283); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f1cf6a';
    ctx.beginPath();
    ctx.moveTo(x, y - r * 2);
    ctx.quadraticCurveTo(x, y, x + r * 2, y);
    ctx.quadraticCurveTo(x, y, x, y + r * 2);
    ctx.quadraticCurveTo(x, y, x - r * 2, y);
    ctx.quadraticCurveTo(x, y, x, y - r * 2);
    ctx.fill();
  }
  function petal(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c + '.8)';
    ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  function frame(ts) {
    var t = ts / 1000;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < items.length; i++) {
      var p = items[i];
      if (!reduce) {
        p.x += p.vx + (p.k === 'p' ? Math.sin(t * .8 + p.ph) * .35 : 0);
        p.y += p.vy; p.rot += p.vr;
        if (p.y < -12) { p.y = H + 12; p.x = Math.random() * W; }
        if (p.y > H + 12) { p.y = -12; p.x = Math.random() * W; }
        if (p.x < -12) p.x = W + 12;
        if (p.x > W + 12) p.x = -12;
      }
      if (p.k === 's') star(p.x, p.y, p.r, .3 + .7 * (.5 + .5 * Math.sin(t * p.sp + p.ph)));
      else { ctx.globalAlpha = 1; petal(p); }
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); seed();
  requestAnimationFrame(frame);
  window.addEventListener('resize', function () { size(); seed(); });

  /* Gentle parallax from pointer and scroll */
  if (!reduce) {
    var tx = 0, ty = 0, cx = 0, cy = 0, sy = 0;
    window.addEventListener('pointermove', function (e) {
      tx = (e.clientX / window.innerWidth - .5) * 2;
      ty = (e.clientY / window.innerHeight - .5) * 2;
    }, { passive: true });
    window.addEventListener('scroll', function () { sy = window.scrollY; }, { passive: true });
    (function loop() {
      cx += (tx - cx) * .06; cy += (ty - cy) * .06;
      var s = card.style;
      s.setProperty('--mx', cx.toFixed(3));
      s.setProperty('--my', cy.toFixed(3));
      s.setProperty('--sy', sy);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>

</body></html>
